<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>Cowork SVG proxy test</title>
<p>로컬 Cowork의 SVG 프록시를 확인하는 중입니다.</p>
<script>
  const svgUrl = new URL('./svg_poc.svg', location.href);
  const coworkUrl = new URL('http://127.0.0.1:48080/api/img');
  coworkUrl.searchParams.set('url', svgUrl.href);
  location.replace(coworkUrl.href);
</script>
</html>
